name: Test no adapter found with strict=true fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake agentshield binary with no adapter
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          cat > "$RUNNER_TEMP/fake/agentshield" <<'EOF'
          #!/bin/bash
          echo "Error: No suitable adapter found for directory: $2" >&2
          exit 2
          EOF
          chmod +x "$RUNNER_TEMP/fake/agentshield"
      - id: action
        uses: .
        continue-on-error: true
        with:
          binary-path: ${{ runner.temp }}/fake/agentshield
          upload-sarif: 'false'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure outcome"; exit 1; fi
          if [ "$EXIT_CODE" != "2" ]; then echo "FAIL: exit-code should be 2"; exit 1; fi
          echo "PASS"
