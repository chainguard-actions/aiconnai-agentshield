name: Test no-adapter strict mode (should fail)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (no adapter found)
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/agentshield" << 'EOF'
          #!/bin/sh
          echo "No suitable adapter found for directory: ."
          exit 2
          EOF
          chmod +x "$RUNNER_TEMP/fake-bin/agentshield"

      - id: action
        uses: .
        with:
          binary-path: "${{ runner.temp }}/fake-bin/agentshield"
          path: "."
          format: "console"
          strict: "true"
          upload-sarif: "false"
        continue-on-error: true

      - name: Assert action failed (strict=true with no adapter should fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in strict mode with no adapter, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed in strict mode when no adapter found"
