name: Test no adapter fails with default strict
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake agentshield
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          cp tests/fixtures/fake-agentshield.sh "$RUNNER_TEMP/fake/agentshield"
          chmod +x "$RUNNER_TEMP/fake/agentshield"
          echo noadapter > /tmp/fake-agentshield-mode
      - id: action
        uses: .
        continue-on-error: true
        with:
          binary-path: ${{ runner.temp }}/fake/agentshield
          upload-sarif: 'false'
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          echo "PASS"
