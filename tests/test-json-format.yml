name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (JSON format, no findings)
        run: |
          mkdir -p /tmp/fake-agentshield-bin
          cat > /tmp/fake-agentshield-bin/agentshield << 'EOF'
          #!/bin/sh
          # Fake agentshield binary: simulates a clean scan in JSON format
          fmt="console"
          prev=""
          for arg in "$@"; do
            case "$prev" in
              --format) fmt="$arg" ;;
            esac
            prev="$arg"
          done
          if [ "$fmt" = "json" ]; then
            echo '{"findings":[],"summary":{"total":0}}'
          else
            echo "AgentShield scan complete. No findings."
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-agentshield-bin/agentshield

      - id: action
        uses: .
        with:
          path: '.'
          fail-on: 'high'
          format: 'json'
          upload-sarif: 'false'
          binary-path: '/tmp/fake-agentshield-bin/agentshield'
        continue-on-error: true

      - name: Assert exit-code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 but got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert finding-count is 0 (no SARIF, defaults to 0)
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected finding-count=0 but got '$COUNT'"
            exit 1
          fi
          echo "PASS"

      - name: Assert sarif-file is empty (format is json, not sarif)
        env:
          SARIF: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: '$SARIF'"
          if [ -n "$SARIF" ]; then
            echo "FAIL: expected sarif-file to be empty for json format, but got '$SARIF'"
            exit 1
          fi
          echo "PASS: sarif-file is empty as expected for json format"
