name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock curl
        run: |
          # Place fake curl ahead of real curl on PATH
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl.sh" "$HOME/.local/bin/curl"
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          path: '.'
          fail-on: 'critical'
          format: 'json'
          upload-sarif: 'false'
        continue-on-error: true

      - name: Assert exit-code is a valid value
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ] && [ "$EXIT_CODE" != "2" ]; then
            echo "FAIL: exit-code '$EXIT_CODE' is not a valid value (expected 0, 1, or 2)"
            exit 1
          fi
          echo "PASS: exit-code is valid: $EXIT_CODE"

      - name: Assert sarif-file is empty for JSON format
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: '$SARIF_FILE'"
          if [ -n "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file should be empty when format=json, got: $SARIF_FILE"
            exit 1
          fi
          echo "PASS: sarif-file is empty as expected for JSON format"

      - name: Assert finding-count is 0 for non-SARIF format
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: finding-count should be 0 when format=json (no SARIF to parse), got: $COUNT"
            exit 1
          fi
          echo "PASS: finding-count is 0 as expected for JSON format"
