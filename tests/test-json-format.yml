name: Test JSON format scan with provided binary
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (JSON format, no findings)
        run: |
          mkdir -p /tmp/fake-agentshield-bin
          cat > /tmp/fake-agentshield-bin/agentshield << 'FAKEEOF'
          #!/bin/sh
          # JSON format: print to stdout, exit 0
          echo '{"findings":[]}'
          exit 0
          FAKEEOF
          chmod +x /tmp/fake-agentshield-bin/agentshield

      - id: action
        uses: .
        with:
          path: '.'
          format: 'json'
          fail-on: 'high'
          upload-sarif: 'false'
          binary-path: '/tmp/fake-agentshield-bin/agentshield'

      - name: Assert exit-code is 0
        env:
          ACTUAL: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "actual exit-code: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exit-code=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert finding-count is 0
        env:
          ACTUAL: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "actual finding-count: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected finding-count=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert sarif-file output is empty for non-sarif format
        env:
          ACTUAL: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "actual sarif-file: '$ACTUAL'"
          # For non-sarif format, sarif-file should be empty
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected sarif-file to be empty for json format, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
