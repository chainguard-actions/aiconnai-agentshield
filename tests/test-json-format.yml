name: Test JSON format output
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare fake agentshield binary (clean scan, json format) from fixture
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-agentshield-pass.sh" /tmp/fake-agentshield-bin
          chmod +x /tmp/fake-agentshield-bin
          echo "Fake binary ready at /tmp/fake-agentshield-bin"

      - id: action
        uses: .
        with:
          path: '.'
          format: 'json'
          fail-on: 'high'
          upload-sarif: 'false'
          binary-path: '/tmp/fake-agentshield-bin'

      - name: Assert exit-code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 but got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert sarif-file is empty (json format produces no sarif)
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: '$SARIF_FILE'"
          if [ -n "$SARIF_FILE" ]; then
            echo "FAIL: expected sarif-file to be empty for json format, but got '$SARIF_FILE'"
            exit 1
          fi
          echo "PASS: sarif-file is empty as expected for json format"

      - name: Assert finding-count is 0
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected finding-count=0 but got '$COUNT'"
            exit 1
          fi
          echo "PASS"
