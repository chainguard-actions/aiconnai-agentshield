name: Test ignore-tests flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (verifies --ignore-tests flag)
        run: |
          mkdir -p /tmp/fake-agentshield-bin
          cat > /tmp/fake-agentshield-bin/agentshield << 'EOF'
          #!/bin/sh
          # Fake agentshield binary: checks that --ignore-tests is passed
          ignore_tests="false"
          for arg in "$@"; do
            case "$arg" in
              --ignore-tests) ignore_tests="true" ;;
            esac
          done
          if [ "$ignore_tests" != "true" ]; then
            echo "ERROR: --ignore-tests flag was not passed to agentshield"
            exit 2
          fi
          echo "AgentShield scan complete (ignore-tests=true). No findings."
          exit 0
          EOF
          chmod +x /tmp/fake-agentshield-bin/agentshield

      - id: action
        uses: .
        with:
          path: '.'
          fail-on: 'high'
          format: 'console'
          upload-sarif: 'false'
          ignore-tests: 'true'
          binary-path: '/tmp/fake-agentshield-bin/agentshield'
        continue-on-error: true

      - name: Assert exit-code is 0 (ignore-tests flag accepted)
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 but got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: --ignore-tests flag was correctly passed to agentshield"
