name: Test ignore-tests flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake agentshield binary and mock curl
        run: |
          mkdir -p /tmp/fake-bin /tmp/fake-agentshield-dir

          # Write the fake agentshield binary (no nested heredoc)
          FAKE_BIN=/tmp/fake-agentshield-dir/agentshield
          printf '%s\n' '#!/bin/sh' \
            'FORMAT=console OUTPUT="" IGNORE_TESTS=0' \
            'i=1' \
            'while [ $i -le $# ]; do' \
            '  eval "arg=\${$i}"' \
            '  case "$arg" in' \
            '    --format) i=$((i+1)); eval "FORMAT=\${$i}" ;;' \
            '    --output) i=$((i+1)); eval "OUTPUT=\${$i}" ;;' \
            '    --ignore-tests) IGNORE_TESTS=1 ;;' \
            '  esac' \
            '  i=$((i+1))' \
            'done' \
            'if [ "$FORMAT" = "sarif" ] && [ -n "$OUTPUT" ]; then' \
            '  printf '"'"'{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"agentshield"}},"results":[]}]}\n'"'"' > "$OUTPUT"' \
            'fi' \
            'if [ "$IGNORE_TESTS" = "1" ]; then' \
            '  echo "AgentShield scan complete (test files ignored). No findings."' \
            'else' \
            '  echo "AgentShield scan complete. No findings."' \
            'fi' \
            'exit 0' > "$FAKE_BIN"
          chmod +x "$FAKE_BIN"

          # Package into a tarball
          tar czf /tmp/fake-agentshield.tar.gz -C /tmp/fake-agentshield-dir agentshield

          # Write the fake curl script
          printf '%s\n' '#!/bin/sh' \
            'out="" prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in -o|--output) out="$arg" ;; esac' \
            '  prev="$arg"' \
            'done' \
            'case "$*" in' \
            '  *agentshield*)' \
            '    if [ -n "$out" ]; then cp /tmp/fake-agentshield.tar.gz "$out"' \
            '    else cat /tmp/fake-agentshield.tar.gz; fi' \
            '    exit 0 ;;' \
            'esac' \
            'exec /usr/bin/curl "$@"' > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          path: '.'
          format: 'console'
          fail-on: 'critical'
          upload-sarif: 'false'
          ignore-tests: 'true'
          version: 'v0.8.5'
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ] && [ "$EXIT_CODE" != "2" ]; then
            echo "FAIL: unexpected exit-code value: $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE"

      - name: Assert finding-count is 0 for console format
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          # With console format (not sarif), finding-count should always be 0
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected finding-count=0 for console format, got: $COUNT"
            exit 1
          fi
          echo "PASS: finding-count=$COUNT"
