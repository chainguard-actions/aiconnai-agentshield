name: Test strict=true (no adapter found, blocking)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (no adapter found)
        run: |
          mkdir -p /tmp/fake-agentshield-bin
          cat > /tmp/fake-agentshield-bin/agentshield << 'EOF'
          #!/bin/sh
          # Fake agentshield binary: simulates no adapter found (exit 2)
          out=""
          fmt="console"
          prev=""
          for arg in "$@"; do
            case "$prev" in
              --output) out="$arg" ;;
              --format) fmt="$arg" ;;
            esac
            prev="$arg"
          done
          if [ "$fmt" = "sarif" ] && [ -n "$out" ]; then
            cat > "$out" << 'SARIF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "AgentShield",
                    "version": "0.0.0-fake"
                  }
                },
                "results": []
              }
            ]
          }
          SARIF
          fi
          echo "No suitable adapter found for directory: ."
          exit 2
          EOF
          chmod +x /tmp/fake-agentshield-bin/agentshield

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '.'
          fail-on: 'high'
          format: 'sarif'
          upload-sarif: 'false'
          strict: 'true'
          binary-path: '/tmp/fake-agentshield-bin/agentshield'

      - name: Assert action failed (strict=true blocks on no-adapter)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with strict=true and no adapter, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with strict=true and no adapter found"
