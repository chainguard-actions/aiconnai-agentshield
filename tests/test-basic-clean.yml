name: Test basic clean scan (no findings)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock agentshield binary (clean scan)
        run: |
          MOCK_BIN="$RUNNER_TEMP/mock-agentshield"
          cat > "$MOCK_BIN" << 'EOF'
          #!/usr/bin/env bash
          # Mock agentshield: exits 0 (no findings above threshold)
          # If --output is passed, write a minimal SARIF file
          OUTPUT_FILE=""
          while [[ $# -gt 0 ]]; do
            if [[ "$1" == "--output" ]]; then
              OUTPUT_FILE="$2"
              shift 2
            else
              shift
            fi
          done
          if [ -n "$OUTPUT_FILE" ]; then
            cat > "$OUTPUT_FILE" << 'SARIF'
          {
            "version": "2.1.0",
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "runs": [
              {
                "tool": {"driver": {"name": "AgentShield", "rules": []}},
                "results": []
              }
            ]
          }
          SARIF
          fi
          exit 0
          EOF
          chmod +x "$MOCK_BIN"
          echo "MOCK_BIN=$MOCK_BIN" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          path: '.'
          fail-on: 'high'
          format: 'sarif'
          upload-sarif: 'false'
          binary-path: ${{ env.MOCK_BIN }}

      - name: Assert exit-code is 0
        env:
          ACTUAL: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "actual exit-code: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exit-code '0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert finding-count is 0
        env:
          ACTUAL: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "actual finding-count: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected finding-count '0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert sarif-file output is set
        env:
          ACTUAL: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "actual sarif-file: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected sarif-file to be non-empty"
            exit 1
          fi
          echo "PASS"
