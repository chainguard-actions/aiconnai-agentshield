name: Test findings above threshold fail the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake agentshield
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          cp tests/fixtures/fake-agentshield.sh "$RUNNER_TEMP/fake/agentshield"
          chmod +x "$RUNNER_TEMP/fake/agentshield"
          echo findings > /tmp/fake-agentshield-mode
          rm -f /tmp/fake-agentshield-args.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          binary-path: ${{ runner.temp }}/fake/agentshield
          upload-sarif: 'false'
          fail-on: medium
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "outcome: $OUTCOME exit-code: $EXIT_CODE count: $COUNT"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "1" ]; then echo "FAIL: exit-code"; exit 1; fi
          if [ -n "$COUNT" ] && [ "$COUNT" != "2" ]; then echo "FAIL: finding-count"; exit 1; fi
          grep -q -- "--fail-on medium" /tmp/fake-agentshield-args.log || { echo "FAIL: fail-on not passed"; exit 1; }
          echo "PASS"
