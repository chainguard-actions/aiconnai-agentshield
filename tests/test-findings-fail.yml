name: Test findings above threshold fail the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake agentshield binary reporting findings
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          cat > "$RUNNER_TEMP/fake/agentshield" <<'EOF'
          #!/bin/bash
          echo "$@" > /tmp/agentshield-args.log
          out=""; prev=""
          for a in "$@"; do
            if [ "$prev" = "--output" ]; then out="$a"; fi
            prev="$a"
          done
          if [ -n "$out" ]; then
            printf '%s' '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"agentshield"}},"results":[{"ruleId":"SHIELD-001","level":"error","message":{"text":"bad"},"locations":[{"physicalLocation":{"artifactLocation":{"uri":"a.ts"},"region":{"startLine":3}}}]},{"ruleId":"SHIELD-002","level":"warning","message":{"text":"meh"}}]}]}' > "$out"
          fi
          echo "Found 2 findings"
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/fake/agentshield"
      - id: action
        uses: .
        continue-on-error: true
        with:
          binary-path: ${{ runner.temp }}/fake/agentshield
          upload-sarif: 'false'
          fail-on: medium
      - name: Assert action failed with findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "finding-count: $COUNT"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure outcome"; exit 1; fi
          if [ "$EXIT_CODE" != "1" ]; then echo "FAIL: exit-code should be 1"; exit 1; fi
          if [ "$COUNT" != "2" ]; then echo "FAIL: finding-count should be 2"; exit 1; fi
          grep -q -- "--fail-on medium" /tmp/agentshield-args.log || { echo "FAIL: fail-on not passed"; exit 1; }
          echo "PASS"
