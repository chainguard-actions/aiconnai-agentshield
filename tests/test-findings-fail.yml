name: Test findings above threshold (action fails)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (findings found, exit 1)
        run: |
          mkdir -p /tmp/fake-agentshield-bin
          cat > /tmp/fake-agentshield-bin/agentshield << 'EOF'
          #!/bin/sh
          # Fake agentshield binary: simulates findings above threshold (exit 1)
          out=""
          fmt="console"
          prev=""
          for arg in "$@"; do
            case "$prev" in
              --output) out="$arg" ;;
              --format) fmt="$arg" ;;
            esac
            prev="$arg"
          done
          if [ "$fmt" = "sarif" ] && [ -n "$out" ]; then
            cat > "$out" << 'SARIF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "AgentShield",
                    "version": "0.0.0-fake"
                  }
                },
                "results": [
                  {
                    "ruleId": "SHIELD-001",
                    "level": "error",
                    "message": {
                      "text": "Unpinned dependency detected"
                    },
                    "locations": [
                      {
                        "physicalLocation": {
                          "artifactLocation": {
                            "uri": "requirements.txt"
                          },
                          "region": {
                            "startLine": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          SARIF
          fi
          echo "AgentShield found 1 finding(s) above the threshold."
          exit 1
          EOF
          chmod +x /tmp/fake-agentshield-bin/agentshield

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '.'
          fail-on: 'high'
          format: 'sarif'
          upload-sarif: 'false'
          binary-path: '/tmp/fake-agentshield-bin/agentshield'

      - name: Assert action failed (findings above threshold)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when findings exceed threshold, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed due to findings above threshold"

      - name: Assert exit-code output is 1
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit-code=1 but got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert finding-count is 1
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected finding-count=1 but got '$COUNT'"
            exit 1
          fi
          echo "PASS"
