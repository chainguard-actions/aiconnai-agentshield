name: Test findings detected - action fails on threshold breach
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare fake agentshield binary (with findings) from fixture
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-agentshield-findings.sh" /tmp/fake-agentshield-bin
          chmod +x /tmp/fake-agentshield-bin
          echo "Fake binary ready at /tmp/fake-agentshield-bin"

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '.'
          format: 'sarif'
          fail-on: 'high'
          upload-sarif: 'false'
          binary-path: '/tmp/fake-agentshield-bin'

      - name: Assert action failed (findings above threshold)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when findings exceed threshold, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when findings were detected"

      - name: Assert exit-code is 1
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit-code=1 but got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert finding-count is 1
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected finding-count=1 but got '$COUNT'"
            exit 1
          fi
          echo "PASS"
