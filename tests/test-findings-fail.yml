name: Test findings above threshold causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (1 finding, exit 1)
        run: |
          mkdir -p /tmp/fake-agentshield-findings
          cat > /tmp/fake-agentshield-findings/agentshield << 'EOF'
          #!/bin/sh
          # Parse args to find --output flag
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              --output|-o) out="$arg" ;;
            esac
            prev="$arg"
          done
          # If sarif output requested, write a SARIF file with one finding
          if [ -n "$out" ]; then
            cat > "$out" << 'SARIF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "AgentShield",
                    "version": "0.0.0-fake"
                  }
                },
                "results": [
                  {
                    "ruleId": "AS001",
                    "level": "error",
                    "message": {
                      "text": "Hardcoded secret detected"
                    },
                    "locations": [
                      {
                        "physicalLocation": {
                          "artifactLocation": {
                            "uri": "agent.py"
                          },
                          "region": {
                            "startLine": 42
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          SARIF
          fi
          echo "Found 1 high severity finding"
          exit 1
          EOF
          chmod +x /tmp/fake-agentshield-findings/agentshield

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '.'
          fail-on: 'high'
          format: 'sarif'
          upload-sarif: 'false'
          strict: 'true'
          binary-path: '/tmp/fake-agentshield-findings/agentshield'

      - name: Assert action failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "finding-count: $COUNT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when findings exceed threshold, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit-code=1, got '$EXIT_CODE'"
            exit 1
          fi
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected finding-count=1, got '$COUNT'"
            exit 1
          fi
          echo "PASS: action correctly failed with 1 finding above threshold"
