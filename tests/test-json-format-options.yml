name: Test json format and option forwarding
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake agentshield binary
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          cat > "$RUNNER_TEMP/fake/agentshield" <<'EOF'
          #!/bin/bash
          echo "$@" > /tmp/agentshield-args.log
          echo '{"findings":[]}'
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fake/agentshield"
      # continue-on-error: act cannot resolve the composite's pinned
      # github/codeql-action ref, marking the composite failed after all shell
      # steps have run. Outputs and forwarded args are validated strictly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          binary-path: ${{ runner.temp }}/fake/agentshield
          path: tests
          format: json
          fail-on: critical
          config: my.agentshield.toml
          baseline: baseline.json
          ignore-tests: 'true'
      - name: Assert outputs and args
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          COUNT: ${{ steps.action.outputs.finding-count }}
          SARIF: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then echo "FAIL: unexpected outcome"; exit 1; fi
          if [ ! -f /tmp/agentshield-args.log ]; then echo "FAIL: scanner was not invoked"; exit 1; fi
          ARGS="$(cat /tmp/agentshield-args.log)"
          echo "args: $ARGS"
          echo "exit-code: $EXIT_CODE count: $COUNT sarif: '$SARIF'"
          if [ "$EXIT_CODE" != "0" ]; then echo "FAIL: exit-code should be 0"; exit 1; fi
          if [ "$COUNT" != "0" ]; then echo "FAIL: finding-count should be 0"; exit 1; fi
          if [ -n "$SARIF" ]; then echo "FAIL: sarif-file should be empty for json"; exit 1; fi
          EXPECTED="scan tests --fail-on critical --format json --config my.agentshield.toml --baseline baseline.json --ignore-tests"
          if [ "$ARGS" != "$EXPECTED" ]; then echo "FAIL: expected args '$EXPECTED'"; exit 1; fi
          echo "PASS"
