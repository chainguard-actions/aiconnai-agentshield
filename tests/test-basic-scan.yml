name: Test basic scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock curl
        run: |
          # Place fake curl ahead of real curl on PATH
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl.sh" "$HOME/.local/bin/curl"
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          path: '.'
          fail-on: 'critical'
          format: 'sarif'
          upload-sarif: 'false'
          ignore-tests: 'false'
        continue-on-error: true

      - name: Assert exit-code is a valid value
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ] && [ "$EXIT_CODE" != "2" ]; then
            echo "FAIL: exit-code '$EXIT_CODE' is not a valid value (expected 0, 1, or 2)"
            exit 1
          fi
          echo "PASS: exit-code is valid: $EXIT_CODE"

      - name: Assert finding-count is a number
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: finding-count '$COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: finding-count is a valid number: $COUNT"

      - name: Assert sarif-file output is set
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file output is set: $SARIF_FILE"
