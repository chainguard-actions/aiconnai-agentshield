name: Test SARIF format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake agentshield binary and mock curl
        run: |
          mkdir -p /tmp/fake-bin /tmp/fake-agentshield-dir

          # Write the fake agentshield binary (no nested heredoc)
          FAKE_BIN=/tmp/fake-agentshield-dir/agentshield
          printf '%s\n' '#!/bin/sh' \
            'FORMAT=console OUTPUT=""' \
            'i=1' \
            'while [ $i -le $# ]; do' \
            '  eval "arg=\${$i}"' \
            '  case "$arg" in' \
            '    --format) i=$((i+1)); eval "FORMAT=\${$i}" ;;' \
            '    --output) i=$((i+1)); eval "OUTPUT=\${$i}" ;;' \
            '  esac' \
            '  i=$((i+1))' \
            'done' \
            'if [ "$FORMAT" = "sarif" ] && [ -n "$OUTPUT" ]; then' \
            '  printf '"'"'{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"agentshield"}},"results":[]}]}\n'"'"' > "$OUTPUT"' \
            'fi' \
            'echo "AgentShield scan complete. No findings."' \
            'exit 0' > "$FAKE_BIN"
          chmod +x "$FAKE_BIN"

          # Package into a tarball
          tar czf /tmp/fake-agentshield.tar.gz -C /tmp/fake-agentshield-dir agentshield

          # Write the fake curl script
          printf '%s\n' '#!/bin/sh' \
            'out="" prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in -o|--output) out="$arg" ;; esac' \
            '  prev="$arg"' \
            'done' \
            'case "$*" in' \
            '  *agentshield*)' \
            '    if [ -n "$out" ]; then cp /tmp/fake-agentshield.tar.gz "$out"' \
            '    else cat /tmp/fake-agentshield.tar.gz; fi' \
            '    exit 0 ;;' \
            'esac' \
            'exec /usr/bin/curl "$@"' > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          path: '.'
          format: 'sarif'
          fail-on: 'critical'
          upload-sarif: 'false'
          ignore-tests: 'false'
          version: 'v0.8.5'
        continue-on-error: true

      - name: Assert sarif-file output is set
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output was not set"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF_FILE"

      - name: Assert SARIF file exists on disk
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "Checking for SARIF file at: $SARIF_FILE"
          if [ ! -f "$SARIF_FILE" ]; then
            echo "FAIL: SARIF file does not exist at $SARIF_FILE"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "Validating SARIF file JSON..."
          if ! python3 -c "import json; json.load(open('$SARIF_FILE'))" 2>/dev/null; then
            echo "FAIL: SARIF file is not valid JSON"
            exit 1
          fi
          echo "PASS: SARIF file is valid JSON"

      - name: Assert finding-count output is a number
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: finding-count is not a non-negative integer: $COUNT"
            exit 1
          fi
          echo "PASS: finding-count=$COUNT"

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ] && [ "$EXIT_CODE" != "2" ]; then
            echo "FAIL: unexpected exit-code value: $EXIT_CODE"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE"
