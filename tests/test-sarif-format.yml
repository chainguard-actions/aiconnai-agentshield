name: Test SARIF format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock agentshield and mock curl
        shell: bash
        run: |
          # Create a mock agentshield binary that writes a valid SARIF file
          cat > /tmp/mock-agentshield.sh << 'MOCKEOF'
          #!/bin/bash
          FORMAT="console"
          OUTPUT=""
          EXIT_CODE=0
          while [[ $# -gt 0 ]]; do
            case "$1" in
              --format) FORMAT="$2"; shift 2 ;;
              --output) OUTPUT="$2"; shift 2 ;;
              --fail-on|--config) shift 2 ;;
              --ignore-tests) shift ;;
              scan) shift ;;
              *) shift ;;
            esac
          done
          if [ "$FORMAT" = "sarif" ] && [ -n "$OUTPUT" ]; then
            printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"AgentShield","rules":[]}},"results":[]}]}\n' > "$OUTPUT"
          fi
          echo "AgentShield scan complete. No findings."
          exit $EXIT_CODE
          MOCKEOF
          chmod +x /tmp/mock-agentshield.sh

          # Create a tar.gz containing the mock binary named 'agentshield'
          mkdir -p /tmp/agentshield-pkg
          cp /tmp/mock-agentshield.sh /tmp/agentshield-pkg/agentshield
          chmod +x /tmp/agentshield-pkg/agentshield
          tar czf /tmp/agentshield-mock.tar.gz -C /tmp/agentshield-pkg agentshield

          # Create a mock curl wrapper that intercepts agentshield-related URLs
          REAL_CURL=$(which curl)
          cat > /usr/local/bin/curl << CURLEOF
          #!/bin/bash
          ALL_ARGS=("\$@")
          URL=""
          OUTPUT_FILE=""
          i=0
          while [ \$i -lt \${#ALL_ARGS[@]} ]; do
            arg="\${ALL_ARGS[\$i]}"
            case "\$arg" in
              -o|--output)
                i=\$((i+1))
                OUTPUT_FILE="\${ALL_ARGS[\$i]}"
                ;;
            esac
            i=\$((i+1))
          done
          for arg in "\${ALL_ARGS[@]}"; do
            if echo "\$arg" | grep -q "^http"; then
              URL="\$arg"
            fi
          done

          if echo "\$URL" | grep -q "api.github.com"; then
            echo '{"tag_name":"v0.1.0","name":"v0.1.0"}'
            exit 0
          elif echo "\$URL" | grep -qE "(agentshield|limaronaldo)"; then
            if [ -n "\$OUTPUT_FILE" ]; then
              cp /tmp/agentshield-mock.tar.gz "\$OUTPUT_FILE"
            else
              cat /tmp/agentshield-mock.tar.gz
            fi
            exit 0
          else
            exec $REAL_CURL "\$@"
          fi
          CURLEOF
          chmod +x /usr/local/bin/curl

      - id: action
        uses: .
        with:
          path: '.'
          format: 'sarif'
          fail-on: 'critical'
          upload-sarif: 'false'
        continue-on-error: true

      - name: Assert sarif-file output is set
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output was not set"
            exit 1
          fi
          echo "PASS: sarif-file is '$SARIF_FILE'"

      - name: Assert SARIF file exists on disk
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "Checking for SARIF file at: $SARIF_FILE"
          if [ ! -f "$SARIF_FILE" ]; then
            echo "FAIL: SARIF file does not exist at '$SARIF_FILE'"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "Validating SARIF file JSON at: $SARIF_FILE"
          if ! python3 -c "import json; json.load(open('$SARIF_FILE'))" 2>/dev/null; then
            echo "FAIL: SARIF file is not valid JSON"
            exit 1
          fi
          echo "PASS: SARIF file is valid JSON"

      - name: Assert finding-count is a number
        env:
          FINDING_COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $FINDING_COUNT"
          if ! echo "$FINDING_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: finding-count '$FINDING_COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: finding-count '$FINDING_COUNT' is a valid number"
