name: Test SARIF format with no findings
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (clean scan, SARIF output)
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/agentshield" << 'SCRIPT'
          #!/bin/sh
          # Parse args to find --output flag
          OUTPUT_FILE=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              --output|-o) OUTPUT_FILE="$arg" ;;
            esac
            prev="$arg"
          done

          # Write minimal valid SARIF with no results if output file specified
          if [ -n "$OUTPUT_FILE" ]; then
            cat > "$OUTPUT_FILE" << 'SARIF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "AgentShield",
                    "version": "0.0.0-test"
                  }
                },
                "results": []
              }
            ]
          }
          SARIF
          fi
          echo "Scan complete. No findings."
          exit 0
          SCRIPT
          chmod +x "$RUNNER_TEMP/fake-bin/agentshield"

      - id: action
        uses: .
        with:
          binary-path: "${{ runner.temp }}/fake-bin/agentshield"
          path: "."
          format: "sarif"
          fail-on: "high"
          upload-sarif: "false"

      - name: Assert exit-code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code=0"

      - name: Assert finding-count is 0
        env:
          FINDING_COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $FINDING_COUNT"
          if [ "$FINDING_COUNT" != "0" ]; then
            echo "FAIL: expected finding-count=0, got '$FINDING_COUNT'"
            exit 1
          fi
          echo "PASS: finding-count=0"

      - name: Assert sarif-file output is set
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          if [ ! -f "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file '$SARIF_FILE' does not exist on disk"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF_FILE"
