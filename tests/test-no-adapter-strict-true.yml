name: Test no adapter found with strict=true (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (no adapter found, exit 2)
        run: |
          mkdir -p /tmp/fake-agentshield-strict
          cat > /tmp/fake-agentshield-strict/agentshield << 'EOF'
          #!/bin/sh
          echo "No suitable adapter found for directory: ."
          exit 2
          EOF
          chmod +x /tmp/fake-agentshield-strict/agentshield

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '.'
          fail-on: 'high'
          format: 'console'
          upload-sarif: 'false'
          strict: 'true'
          binary-path: '/tmp/fake-agentshield-strict/agentshield'

      - name: Assert action failed (strict=true with no adapter should fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with strict=true and no adapter, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with strict=true when no adapter found"
