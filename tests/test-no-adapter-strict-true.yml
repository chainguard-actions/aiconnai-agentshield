name: Test no adapter found with strict=true (blocking)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare fake agentshield binary (no adapter) from fixture
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-agentshield-no-adapter.sh" /tmp/fake-agentshield-bin
          chmod +x /tmp/fake-agentshield-bin
          echo "Fake binary ready at /tmp/fake-agentshield-bin"

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '.'
          format: 'console'
          fail-on: 'high'
          upload-sarif: 'false'
          strict: 'true'
          binary-path: '/tmp/fake-agentshield-bin'

      - name: Assert action failed (strict=true with no adapter should fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with strict=true and no adapter, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when strict=true and no adapter found"
