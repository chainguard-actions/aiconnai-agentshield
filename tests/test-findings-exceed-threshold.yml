name: Test findings exceed fail-on threshold
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (findings found, exit 1)
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/agentshield" << 'SCRIPT'
          #!/bin/sh
          # Parse args to find --output flag
          OUTPUT_FILE=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              --output|-o) OUTPUT_FILE="$arg" ;;
            esac
            prev="$arg"
          done

          # Write SARIF with one high-severity finding
          if [ -n "$OUTPUT_FILE" ]; then
            cat > "$OUTPUT_FILE" << 'SARIF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "AgentShield",
                    "version": "0.0.0-test"
                  }
                },
                "results": [
                  {
                    "ruleId": "AS001",
                    "level": "error",
                    "message": { "text": "High severity finding detected" },
                    "locations": [
                      {
                        "physicalLocation": {
                          "artifactLocation": { "uri": "agent.py" },
                          "region": { "startLine": 10 }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          SARIF
          fi
          echo "Found 1 security finding(s) above threshold."
          exit 1
          SCRIPT
          chmod +x "$RUNNER_TEMP/fake-bin/agentshield"

      - id: action
        uses: .
        with:
          binary-path: "${{ runner.temp }}/fake-bin/agentshield"
          path: "."
          format: "sarif"
          fail-on: "high"
          upload-sarif: "false"
        continue-on-error: true

      - name: Assert action failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when findings exceed threshold, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when findings exceed threshold"

      - name: Assert exit-code is 1
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit-code=1, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code=1"

      - name: Assert finding-count is 1
        env:
          FINDING_COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $FINDING_COUNT"
          if [ "$FINDING_COUNT" != "1" ]; then
            echo "FAIL: expected finding-count=1, got '$FINDING_COUNT'"
            exit 1
          fi
          echo "PASS: finding-count=1"
