name: Test invalid binary-path causes error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a non-executable file to use as invalid binary
        run: |
          mkdir -p /tmp/fake-agentshield-invalid
          echo "not a binary" > /tmp/fake-agentshield-invalid/agentshield
          # Deliberately NOT chmod +x — file is not executable

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '.'
          fail-on: 'high'
          format: 'sarif'
          upload-sarif: 'false'
          strict: 'true'
          binary-path: '/tmp/fake-agentshield-invalid/agentshield'

      - name: Assert action failed due to non-executable binary
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with non-executable binary, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when binary-path is not executable"
