name: Test invalid binary-path (non-executable)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a non-executable file
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          echo "not a binary" > "$RUNNER_TEMP/fake-bin/agentshield-bad"
          # Explicitly remove execute permission
          chmod -x "$RUNNER_TEMP/fake-bin/agentshield-bad"

      - id: action
        uses: .
        with:
          binary-path: "${{ runner.temp }}/fake-bin/agentshield-bad"
          path: "."
          format: "console"
          upload-sarif: "false"
        continue-on-error: true

      - name: Assert action failed due to non-executable binary
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with non-executable binary, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when binary-path is not executable"
