name: Test console format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock tools
        run: |
          mkdir -p /tmp/mock-bin

          # Create a fake agentshield script for console format
          cat > /tmp/mock-bin/agentshield << 'AGENTSHIELD_EOF'
          #!/bin/sh
          echo "AgentShield scan complete. No findings."
          exit 0
          AGENTSHIELD_EOF
          chmod +x /tmp/mock-bin/agentshield

          # Create a fake curl that handles GitHub API and binary download
          cat > /tmp/mock-bin/curl << 'CURL_EOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done

          case "$*" in
            *api.github.com*releases/latest*)
              payload='{"tag_name":"v0.8.6","name":"v0.8.6"}'
              if [ -n "$out" ]; then
                echo "$payload" > "$out"
              else
                echo "$payload"
              fi
              exit 0
              ;;
            *agentshield*.tar.gz*|*agentshield*.zip*)
              TMPDIR_FAKE=$(mktemp -d)
              cp /tmp/mock-bin/agentshield "$TMPDIR_FAKE/agentshield"
              if [ -n "$out" ]; then
                tar czf "$out" -C "$TMPDIR_FAKE" agentshield
              else
                tar czf - -C "$TMPDIR_FAKE" agentshield
              fi
              rm -rf "$TMPDIR_FAKE"
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURL_EOF
          chmod +x /tmp/mock-bin/curl

          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          path: '.'
          fail-on: 'critical'
          format: 'console'
          upload-sarif: 'false'
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

      - name: Assert finding-count defaults to 0 for console format
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: finding-count output was not set"
            exit 1
          fi
          echo "PASS: finding-count is '$COUNT'"

      - name: Assert sarif-file is empty for console format
        env:
          SARIF: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: '$SARIF'"
          if [ -n "$SARIF" ]; then
            echo "FAIL: sarif-file should be empty when format=console, got '$SARIF'"
            exit 1
          fi
          echo "PASS: sarif-file is empty as expected for console format"
