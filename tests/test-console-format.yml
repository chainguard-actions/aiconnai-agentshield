name: Test console format output
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (clean scan, console output)
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/agentshield" << 'SCRIPT'
          #!/bin/sh
          echo "AgentShield scan complete. No findings."
          exit 0
          SCRIPT
          chmod +x "$RUNNER_TEMP/fake-bin/agentshield"

      - id: action
        uses: .
        with:
          binary-path: "${{ runner.temp }}/fake-bin/agentshield"
          path: "."
          format: "console"
          fail-on: "medium"
          upload-sarif: "false"

      - name: Assert exit-code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code=0"

      - name: Assert finding-count is 0 (no SARIF file in console mode)
        env:
          FINDING_COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $FINDING_COUNT"
          if [ "$FINDING_COUNT" != "0" ]; then
            echo "FAIL: expected finding-count=0 in console mode, got '$FINDING_COUNT'"
            exit 1
          fi
          echo "PASS: finding-count=0"

      - name: Assert sarif-file output is empty in console mode
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: '$SARIF_FILE'"
          if [ -n "$SARIF_FILE" ]; then
            echo "FAIL: expected sarif-file to be empty in console mode, got '$SARIF_FILE'"
            exit 1
          fi
          echo "PASS: sarif-file is empty as expected for console format"
