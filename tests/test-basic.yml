name: Test basic usage (sarif format, default settings)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock tools
        run: |
          # Create a fake agentshield binary that produces valid SARIF output
          mkdir -p /tmp/mock-bin

          # Create a fake agentshield script
          cat > /tmp/mock-bin/agentshield << 'AGENTSHIELD_EOF'
          #!/bin/sh
          # Parse arguments to find --output flag
          OUTPUT_FILE=""
          FORMAT="console"
          prev=""
          for arg in "$@"; do
            case "$prev" in
              --output|-o) OUTPUT_FILE="$arg" ;;
              --format) FORMAT="$arg" ;;
            esac
            prev="$arg"
          done

          if [ "$FORMAT" = "sarif" ] && [ -n "$OUTPUT_FILE" ]; then
            cat > "$OUTPUT_FILE" << 'SARIF_EOF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "AgentShield",
                    "version": "0.8.6",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          SARIF_EOF
          fi
          exit 0
          AGENTSHIELD_EOF
          chmod +x /tmp/mock-bin/agentshield

          # Create a fake curl that handles GitHub API and binary download
          cat > /tmp/mock-bin/curl << 'CURL_EOF'
          #!/bin/sh
          # Parse args for -o/--output flag
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done

          # Check if this is the GitHub API call for latest version
          case "$*" in
            *api.github.com*releases/latest*)
              payload='{"tag_name":"v0.8.6","name":"v0.8.6"}'
              if [ -n "$out" ]; then
                echo "$payload" > "$out"
              else
                echo "$payload"
              fi
              exit 0
              ;;
            *agentshield*.tar.gz*|*agentshield*.zip*)
              # Create a fake tarball with the agentshield binary
              TMPDIR_FAKE=$(mktemp -d)
              cp /tmp/mock-bin/agentshield "$TMPDIR_FAKE/agentshield"
              if [ -n "$out" ]; then
                tar czf "$out" -C "$TMPDIR_FAKE" agentshield
              else
                tar czf - -C "$TMPDIR_FAKE" agentshield
              fi
              rm -rf "$TMPDIR_FAKE"
              exit 0
              ;;
          esac
          # Fall through to real curl for other URLs
          exec /usr/bin/curl "$@"
          CURL_EOF
          chmod +x /tmp/mock-bin/curl

          # Prepend mock-bin to PATH
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          path: '.'
          fail-on: 'critical'
          format: 'sarif'
          upload-sarif: 'false'
          ignore-tests: 'false'
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code is set to '$EXIT_CODE'"

      - name: Assert finding-count output is set
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: finding-count output was not set"
            exit 1
          fi
          echo "PASS: finding-count is '$COUNT'"

      - name: Assert sarif-file output is set
        env:
          SARIF: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF"
          if [ -z "$SARIF" ]; then
            echo "FAIL: sarif-file output was not set"
            exit 1
          fi
          echo "PASS: sarif-file is '$SARIF'"

      - name: Assert sarif file exists on disk
        env:
          SARIF: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "Checking for SARIF file at: $SARIF"
          if [ ! -f "$SARIF" ]; then
            echo "FAIL: SARIF file does not exist at '$SARIF'"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert sarif file is valid JSON
        env:
          SARIF: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "Validating SARIF file as JSON..."
          if ! python3 -c "import json; json.load(open('$SARIF'))" 2>&1; then
            echo "FAIL: SARIF file is not valid JSON"
            exit 1
          fi
          echo "PASS: SARIF file is valid JSON"
