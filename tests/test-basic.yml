name: Test basic usage with binary-path (strict=false, no adapter)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary
        run: |
          mkdir -p /tmp/fake-agentshield-bin
          cat > /tmp/fake-agentshield-bin/agentshield << 'EOF'
          #!/bin/sh
          # Fake agentshield binary: simulates "no adapter found" scenario
          echo "No suitable adapter found for directory: ."
          exit 2
          EOF
          chmod +x /tmp/fake-agentshield-bin/agentshield

      - id: action
        uses: .
        with:
          path: '.'
          binary-path: '/tmp/fake-agentshield-bin/agentshield'
          strict: 'false'
          upload-sarif: 'false'
          format: 'console'

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

      - name: Assert finding-count output is set
        env:
          FINDING_COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $FINDING_COUNT"
          if [ -z "$FINDING_COUNT" ]; then
            echo "FAIL: finding-count output is empty"
            exit 1
          fi
          echo "PASS: finding-count is '$FINDING_COUNT'"
