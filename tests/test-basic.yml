name: Test basic usage (no findings)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (no findings)
        run: |
          mkdir -p /tmp/fake-agentshield-bin
          cat > /tmp/fake-agentshield-bin/agentshield << 'EOF'
          #!/bin/sh
          # Fake agentshield binary: simulates a clean scan (no findings)
          echo "AgentShield scan complete. No findings."
          exit 0
          EOF
          chmod +x /tmp/fake-agentshield-bin/agentshield

      - id: action
        uses: .
        with:
          path: '.'
          fail-on: 'high'
          format: 'console'
          upload-sarif: 'false'
          binary-path: '/tmp/fake-agentshield-bin/agentshield'
        continue-on-error: true

      - name: Assert exit-code is 0
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 but got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert finding-count is 0
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected finding-count=0 but got '$COUNT'"
            exit 1
          fi
          echo "PASS"
