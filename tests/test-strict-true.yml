name: Test strict=true when no adapter found (should fail)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (no adapter)
        run: |
          mkdir -p /tmp/fake-agentshield-bin
          cat > /tmp/fake-agentshield-bin/agentshield << 'EOF'
          #!/bin/sh
          # Fake agentshield binary: simulates no adapter found (exit 2)
          echo "No suitable adapter found for directory: ."
          exit 2
          EOF
          chmod +x /tmp/fake-agentshield-bin/agentshield

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '.'
          binary-path: '/tmp/fake-agentshield-bin/agentshield'
          strict: 'true'
          upload-sarif: 'false'
          format: 'console'
          fail-on: 'high'

      - name: Assert action failed (strict=true with no adapter should fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with strict=true and no adapter"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with strict=true and no adapter"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
