name: Test fail-on threshold - critical only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake agentshield binary and mock curl
        run: |
          mkdir -p /tmp/fake-bin /tmp/fake-agentshield-dir

          # Write the fake agentshield binary (no nested heredoc)
          FAKE_BIN=/tmp/fake-agentshield-dir/agentshield
          printf '%s\n' '#!/bin/sh' \
            'FORMAT=console OUTPUT=""' \
            'i=1' \
            'while [ $i -le $# ]; do' \
            '  eval "arg=\${$i}"' \
            '  case "$arg" in' \
            '    --format) i=$((i+1)); eval "FORMAT=\${$i}" ;;' \
            '    --output) i=$((i+1)); eval "OUTPUT=\${$i}" ;;' \
            '  esac' \
            '  i=$((i+1))' \
            'done' \
            'if [ "$FORMAT" = "sarif" ] && [ -n "$OUTPUT" ]; then' \
            '  printf '"'"'{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"agentshield"}},"results":[]}]}\n'"'"' > "$OUTPUT"' \
            'fi' \
            'echo "AgentShield scan complete. No findings."' \
            'exit 0' > "$FAKE_BIN"
          chmod +x "$FAKE_BIN"

          # Package into a tarball
          tar czf /tmp/fake-agentshield.tar.gz -C /tmp/fake-agentshield-dir agentshield

          # Write the fake curl script
          printf '%s\n' '#!/bin/sh' \
            'out="" prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in -o|--output) out="$arg" ;; esac' \
            '  prev="$arg"' \
            'done' \
            'case "$*" in' \
            '  *agentshield*)' \
            '    if [ -n "$out" ]; then cp /tmp/fake-agentshield.tar.gz "$out"' \
            '    else cat /tmp/fake-agentshield.tar.gz; fi' \
            '    exit 0 ;;' \
            'esac' \
            'exec /usr/bin/curl "$@"' > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          path: '.'
          format: 'sarif'
          fail-on: 'critical'
          upload-sarif: 'false'
          ignore-tests: 'false'
          version: 'v0.8.5'
        continue-on-error: true

      - name: Assert action completed (exit-code is set)
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set — action may have errored during setup"
            exit 1
          fi
          echo "PASS: action completed with exit-code=$EXIT_CODE"

      - name: Assert finding-count is a non-negative integer
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "finding-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: finding-count is not a non-negative integer: $COUNT"
            exit 1
          fi
          echo "PASS: finding-count=$COUNT"

      - name: Assert no critical findings (fake scan returns 0)
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          # Fake agentshield exits 0 (no findings), so action should pass
          if [ "$EXIT_CODE" = "1" ]; then
            echo "FAIL: unexpected findings reported by fake scanner"
            exit 1
          fi
          echo "PASS: no critical findings (exit-code=$EXIT_CODE)"
