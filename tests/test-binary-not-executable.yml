name: Test non-executable binary-path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create non-executable file
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          echo "not a binary" > "$RUNNER_TEMP/fake/agentshield"
          chmod 0644 "$RUNNER_TEMP/fake/agentshield"
      - id: action
        uses: .
        continue-on-error: true
        with:
          binary-path: ${{ runner.temp }}/fake/agentshield
          upload-sarif: 'false'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: '$EXIT_CODE'"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure outcome"; exit 1; fi
          if [ -n "$EXIT_CODE" ]; then echo "FAIL: scan should not have run"; exit 1; fi
          echo "PASS"
