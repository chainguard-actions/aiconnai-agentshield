name: Test basic SARIF scan with provided binary
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake agentshield binary (no findings, SARIF output)
        run: |
          mkdir -p /tmp/fake-agentshield-bin
          cat > /tmp/fake-agentshield-bin/agentshield << 'FAKEEOF'
          #!/bin/sh
          # Parse args to find --output flag
          OUTPUT=""
          FORMAT="console"
          prev=""
          for arg in "$@"; do
            case "$prev" in
              --output|-o) OUTPUT="$arg" ;;
              --format)    FORMAT="$arg" ;;
            esac
            prev="$arg"
          done
          if [ "$FORMAT" = "sarif" ] && [ -n "$OUTPUT" ]; then
            cat > "$OUTPUT" << 'SARIF'
          {
            "version": "2.1.0",
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "runs": [
              {
                "tool": { "driver": { "name": "AgentShield", "rules": [] } },
                "results": []
              }
            ]
          }
          SARIF
          fi
          exit 0
          FAKEEOF
          chmod +x /tmp/fake-agentshield-bin/agentshield

      - id: action
        uses: .
        with:
          path: '.'
          format: 'sarif'
          fail-on: 'high'
          upload-sarif: 'false'
          binary-path: '/tmp/fake-agentshield-bin/agentshield'

      - name: Assert exit-code is 0
        env:
          ACTUAL: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "actual exit-code: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exit-code=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert finding-count is 0
        env:
          ACTUAL: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "actual finding-count: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected finding-count=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert sarif-file output is set
        env:
          ACTUAL: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "actual sarif-file: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected sarif-file to be non-empty"
            exit 1
          fi
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: sarif-file '$ACTUAL' does not exist on disk"
            exit 1
          fi
          echo "PASS"
