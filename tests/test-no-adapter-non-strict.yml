name: Test no adapter found with strict=false
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare fake agentshield binary (no adapter)
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-agentshield-no-adapter.sh" /tmp/fake-agentshield
          chmod +x /tmp/fake-agentshield

      - id: action
        uses: .
        with:
          path: '.'
          format: 'console'
          fail-on: 'high'
          upload-sarif: 'false'
          strict: 'false'
          binary-path: '/tmp/fake-agentshield'
        # strict=false means "no adapter found" (exit 2) should be non-blocking
        continue-on-error: true

      - name: Assert action did not fail (strict=false allows no-adapter)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded as expected with strict=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed but strict=false should make no-adapter non-blocking"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert exit-code is 2 (no adapter)
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "2" ]; then
            echo "FAIL: expected exit-code=2 (no adapter), got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"
