name: Test no adapter is non-blocking with strict=false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake agentshield binary with no adapter
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          cat > "$RUNNER_TEMP/fake/agentshield" <<'EOF'
          #!/usr/bin/env bash
          echo "Error: No suitable adapter found for directory: ." >&2
          exit 2
          EOF
          chmod +x "$RUNNER_TEMP/fake/agentshield"
      - id: action
        uses: .
        with:
          binary-path: ${{ runner.temp }}/fake/agentshield
          upload-sarif: 'false'
          strict: 'false'
      - name: Assert outputs
        env:
          COUNT: ${{ steps.action.outputs.finding-count }}
          EXIT: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "count=$COUNT exit=$EXIT"
          [ "$EXIT" = "2" ] || { echo "FAIL: expected exit-code 2"; exit 1; }
          [ "$COUNT" = "0" ] || { echo "FAIL: expected finding-count 0"; exit 1; }
          echo "PASS"
