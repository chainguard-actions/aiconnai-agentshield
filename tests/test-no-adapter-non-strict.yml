name: Test no adapter is non-blocking with strict=false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake agentshield
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          cp tests/fixtures/fake-agentshield.sh "$RUNNER_TEMP/fake/agentshield"
          chmod +x "$RUNNER_TEMP/fake/agentshield"
          echo noadapter > /tmp/fake-agentshield-mode
      # act tries to resolve the skipped upload-sarif remote action, whose pinned
      # ref is unresolvable under act; tolerate that and assert on outputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          binary-path: ${{ runner.temp }}/fake/agentshield
          upload-sarif: 'false'
          strict: 'false'
      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          echo "outcome: $OUTCOME exit-code: $EXIT_CODE count: $COUNT"
          case "$OUTCOME" in
            success|failure) ;;
            *) echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1 ;;
          esac
          [ "$EXIT_CODE" = "2" ] || { echo "FAIL: expected exit-code 2"; exit 1; }
          [ "$COUNT" = "0" ] || { echo "FAIL: finding-count"; exit 1; }
          LOG="$RUNNER_TEMP/agentshield-scan.log"
          if [ -f "$LOG" ]; then
            grep -Fq "No suitable adapter found for directory:" "$LOG" || { echo "FAIL: no-adapter message missing from scan log"; exit 1; }
          fi
          echo "PASS"
