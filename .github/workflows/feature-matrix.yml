name: Cargo Feature Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  feature-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: No default features
            command: cargo test --no-default-features --locked
          - name: Python parser
            command: cargo check --no-default-features --features python --locked
          - name: TypeScript parser
            command: cargo check --no-default-features --features typescript --locked
          - name: Runtime
            command: cargo check --no-default-features --features runtime --locked
          - name: Runtime guard
            command: cargo check --no-default-features --features runtime,runtime-guard --locked
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.name }}
      - name: Run feature matrix command
        env:
          MATRIX_COMMAND: ${{ matrix.command }}
        run: |
          opts=()
          if [ -n "$MATRIX_COMMAND" ]; then
            while IFS= read -r -d '' t; do opts+=("$t"); done \
              < <(printf '%s' "$MATRIX_COMMAND" | xargs printf '%s\0')
          fi
          "${opts[@]}"
