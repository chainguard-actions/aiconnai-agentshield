name: Action E2E Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Test the GitHub Action against real fixtures
  action-e2e:
    name: Action E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    permissions:
      actions: read       # Required for workflow metadata during SARIF upload
      contents: read
      security-events: write  # Required for SARIF upload

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Build from source (action normally downloads release binary)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build AgentShield
        run: cargo build --release

      # Put binary on PATH so the action's scan step finds it
      - name: Install binary
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          safe_temp=$(printf '%s' "$RUNNER_TEMP" | tr -d '\n\r')
          mkdir -p "${safe_temp}/agentshield"
          cp target/release/agentshield "${safe_temp}/agentshield/"
          printf '%s' "${safe_temp}/agentshield" | tr -d '\n\r' >> "$GITHUB_PATH"

      # --- Test 1: Clean server should PASS ---
      - name: "Test 1: Scan safe_calculator (expect pass)"
        id: scan-safe
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set +e
          agentshield scan tests/fixtures/mcp_servers/safe_calculator --format sarif --output "${RUNNER_TEMP}/safe.sarif" --fail-on high
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::safe_calculator should produce exit code 0, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: safe_calculator scanned clean (exit 0)"

      - name: "Test 1: Verify SARIF output"
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          SARIF="${RUNNER_TEMP}/safe.sarif"
          if [ ! -f "$SARIF" ]; then
            echo "::error::SARIF file not created"
            exit 1
          fi
          # Validate JSON structure and no high/critical findings
          python3 -c "
          import json, sys
          with open('${SARIF}') as f:
              data = json.load(f)
          assert 'runs' in data, 'Missing runs key'
          results = data['runs'][0].get('results', [])
          # May have low/medium supply chain findings, but no high/critical
          high_crit = [r for r in results if r.get('level') in ('error',)]
          assert len(high_crit) == 0, f'Expected 0 high/critical, got {len(high_crit)}'
          print(f'PASS: SARIF valid, {len(results)} results (0 high/critical)')
          "

      # --- Test 2: Vulnerable server should FAIL ---
      - name: "Test 2: Scan vuln_cmd_inject (expect fail)"
        id: scan-vuln
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set +e
          agentshield scan tests/fixtures/mcp_servers/vuln_cmd_inject --format sarif --output "${RUNNER_TEMP}/vuln.sarif" --fail-on high
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "::error::vuln_cmd_inject should produce exit code 1 (findings), got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: vuln_cmd_inject correctly detected (exit 1)"

      - name: "Test 2: Verify findings in SARIF"
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 -c "
          import json, sys
          with open('${RUNNER_TEMP}/vuln.sarif') as f:
              data = json.load(f)
          results = data['runs'][0].get('results', [])
          assert len(results) > 0, 'Expected findings but got 0'
          # Check for SHIELD-001 (command injection)
          rule_ids = [r['ruleId'] for r in results]
          assert 'SHIELD-001' in rule_ids, f'Expected SHIELD-001, got {rule_ids}'
          print(f'PASS: {len(results)} findings, includes SHIELD-001')
          "

      # --- Test 3: SSRF detection ---
      - name: "Test 3: Scan vuln_ssrf (expect fail)"
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set +e
          agentshield scan tests/fixtures/mcp_servers/vuln_ssrf --format json --output "${RUNNER_TEMP}/ssrf.json" --fail-on high
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "::error::vuln_ssrf should produce exit code 1, got $EXIT_CODE"
            exit 1
          fi
          python3 -c "
          import json
          with open('${RUNNER_TEMP}/ssrf.json') as f:
              data = json.load(f)
          findings = data.get('findings', [])
          rule_ids = [f['rule_id'] for f in findings]
          assert 'SHIELD-003' in rule_ids, f'Expected SHIELD-003, got {rule_ids}'
          print(f'PASS: {len(findings)} findings, includes SHIELD-003')
          "

      # --- Test 4: Credential exfiltration detection ---
      - name: "Test 4: Scan vuln_cred_exfil (expect fail)"
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set +e
          agentshield scan tests/fixtures/mcp_servers/vuln_cred_exfil --format json --output "${RUNNER_TEMP}/cred.json" --fail-on high
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "::error::vuln_cred_exfil should produce exit code 1, got $EXIT_CODE"
            exit 1
          fi
          python3 -c "
          import json
          with open('${RUNNER_TEMP}/cred.json') as f:
              data = json.load(f)
          findings = data.get('findings', [])
          rule_ids = [f['rule_id'] for f in findings]
          assert 'SHIELD-002' in rule_ids, f'Expected SHIELD-002, got {rule_ids}'
          print(f'PASS: {len(findings)} findings, includes SHIELD-002')
          "

      # --- Test 5: Console output format ---
      - name: "Test 5: Console output format"
        shell: bash
        run: |
          OUTPUT=$(agentshield scan tests/fixtures/mcp_servers/safe_calculator --format console 2>&1)
          if echo "$OUTPUT" | grep -q "findings\|No issues"; then
            echo "PASS: Console output contains expected text"
          else
            echo "::warning::Console output may not contain expected text"
          fi

      # --- Test 6: HTML output format ---
      - name: "Test 6: HTML output format"
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          agentshield scan tests/fixtures/mcp_servers/vuln_cmd_inject --format html --output "${RUNNER_TEMP}/report.html" || true
          if [ -f "${RUNNER_TEMP}/report.html" ]; then
            SIZE=$(wc -c < "${RUNNER_TEMP}/report.html" | tr -d ' ')
            if [ "$SIZE" -gt 100 ]; then
              echo "PASS: HTML report generated ($SIZE bytes)"
            else
              echo "::error::HTML report too small ($SIZE bytes)"
              exit 1
            fi
          else
            echo "::error::HTML report not created"
            exit 1
          fi

      # --- Test 7: list-rules command ---
      - name: "Test 7: list-rules shows all 18 detectors"
        shell: bash
        run: |
          COUNT=$(agentshield list-rules 2>&1 | grep -c "SHIELD-0")
          if [ "$COUNT" -ge 18 ]; then
            echo "PASS: list-rules shows $COUNT detectors (>= 18)"
          else
            echo "::error::Expected >= 18 detectors, got $COUNT"
            exit 1
          fi

      - name: "Test 8a: Unfiltered subdirectory scan sees ancestor metadata"
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set +e
          agentshield scan tests/fixtures/action_subdir_filters/src/mcp --format json --output "${RUNNER_TEMP}/subdir-unfiltered.json" --fail-on low
          UNFILTERED_EXIT=$?
          set -e

          if [ "$UNFILTERED_EXIT" -ne 1 ]; then
            echo "::error::unfiltered subdirectory scan should fail on ancestor package.json findings, got $UNFILTERED_EXIT"
            exit 1
          fi

          python3 -c "
          from pathlib import Path

          unfiltered = Path('${RUNNER_TEMP}/subdir-unfiltered.json').read_text()
          assert 'package.json' in unfiltered, 'unfiltered scan should read ancestor package metadata'
          assert 'event-stream' in unfiltered, 'unfiltered scan should report dependency metadata'
          print('PASS: unfiltered subdirectory scan read ancestor dependency metadata')
          "

      - name: "Test 8b: Composite action honors root config path filters"
        id: subdir-filtered-action
        uses: ./
        with:
          binary-path: ${{ runner.temp }}/agentshield/agentshield
          path: tests/fixtures/action_subdir_filters/src/mcp
          config: tests/fixtures/action_subdir_filters/.agentshield.toml
          format: sarif
          fail-on: low
          upload-sarif: false

      - name: "Test 8c: Verify composite action filtered SARIF"
        shell: bash
        env:
          SUBDIR_EXIT_CODE: ${{ steps.subdir-filtered-action.outputs.exit-code }}
          SUBDIR_FINDING_COUNT: ${{ steps.subdir-filtered-action.outputs.finding-count }}
          SUBDIR_SARIF_FILE: ${{ steps.subdir-filtered-action.outputs.sarif-file }}
        run: |
          if [ "$SUBDIR_EXIT_CODE" != "0" ]; then
            echo "::error::filtered composite action scan should pass, got $SUBDIR_EXIT_CODE"
            exit 1
          fi
          if [ "$SUBDIR_FINDING_COUNT" != "0" ]; then
            echo "::error::filtered composite action scan should have zero findings, got $SUBDIR_FINDING_COUNT"
            exit 1
          fi

          python3 - "$SUBDIR_SARIF_FILE" << 'EOF'
          import json, sys
          from pathlib import Path

          sarif = Path(sys.argv[1]).read_text()
          assert 'package.json' not in sarif, 'filtered SARIF must not mention excluded package.json'
          assert 'event-stream' not in sarif, 'filtered SARIF must not mention excluded dependency'

          data = json.loads(sarif)
          results = data.get('runs', [{}])[0].get('results', [])
          assert results == [], f'expected no filtered SARIF results, got {results}'
          print('PASS: composite action used root config and suppressed excluded metadata findings')
EOF

      - name: "Test 9a: Prepare strict-mode fixtures"
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          mkdir -p "${RUNNER_TEMP}/agentshield-no-adapter"

      - name: "Test 9b: strict=false permits no-adapter scans"
        id: no-adapter-permissive
        uses: ./
        with:
          binary-path: ${{ runner.temp }}/agentshield/agentshield
          path: ${{ runner.temp }}/agentshield-no-adapter
          format: console
          upload-sarif: false
          strict: false

      - name: "Test 9c: Verify permissive no-adapter result"
        shell: bash
        env:
          NO_ADAPTER_EXIT_CODE: ${{ steps.no-adapter-permissive.outputs.exit-code }}
        run: |
          if [ "$NO_ADAPTER_EXIT_CODE" != "2" ]; then
            echo "::error::strict=false should preserve scanner exit code 2, got $NO_ADAPTER_EXIT_CODE"
            exit 1
          fi
          echo "PASS: strict=false made only the no-adapter check non-blocking"

      - name: "Test 9d: strict=true blocks no-adapter scans"
        id: no-adapter-strict
        continue-on-error: true
        uses: ./
        with:
          binary-path: ${{ runner.temp }}/agentshield/agentshield
          path: ${{ runner.temp }}/agentshield-no-adapter
          format: console
          upload-sarif: false
          strict: true

      - name: "Test 9e: Verify strict no-adapter failure"
        shell: bash
        env:
          NO_ADAPTER_STRICT_OUTCOME: ${{ steps.no-adapter-strict.outcome }}
          NO_ADAPTER_STRICT_EXIT_CODE: ${{ steps.no-adapter-strict.outputs.exit-code }}
        run: |
          if [ "$NO_ADAPTER_STRICT_OUTCOME" != "failure" ]; then
            echo "::error::strict=true should fail a no-adapter scan, got $NO_ADAPTER_STRICT_OUTCOME"
            exit 1
          fi
          if [ "$NO_ADAPTER_STRICT_EXIT_CODE" != "2" ]; then
            echo "::error::strict=true should preserve scanner exit code 2, got $NO_ADAPTER_STRICT_EXIT_CODE"
            exit 1
          fi
          echo "PASS: strict=true kept no-adapter scans blocking"

      - name: "Test 9f: strict=false still blocks invalid config"
        id: invalid-config-permissive
        continue-on-error: true
        uses: ./
        with:
          binary-path: ${{ runner.temp }}/agentshield/agentshield
          path: tests/fixtures/mcp_servers/safe_calculator
          config: tests/fixtures
          format: console
          upload-sarif: false
          strict: false

      - name: "Test 9g: Verify genuine scan errors remain blocking"
        shell: bash
        env:
          INVALID_CONFIG_OUTCOME: ${{ steps.invalid-config-permissive.outcome }}
          INVALID_CONFIG_EXIT_CODE: ${{ steps.invalid-config-permissive.outputs.exit-code }}
        run: |
          if [ "$INVALID_CONFIG_OUTCOME" != "failure" ]; then
            echo "::error::strict=false must not suppress invalid config errors, got $INVALID_CONFIG_OUTCOME"
            exit 1
          fi
          if [ "$INVALID_CONFIG_EXIT_CODE" != "2" ]; then
            echo "::error::invalid config should preserve scanner exit code 2, got $INVALID_CONFIG_EXIT_CODE"
            exit 1
          fi
          echo "PASS: strict=false did not suppress a genuine scan error"

      # --- Upload SARIF for real Code Scanning integration ---
      - name: Upload SARIF to Code Scanning
        if: always() && matrix.os == 'ubuntu-latest'
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: ${{ runner.temp }}/vuln.sarif
          category: agentshield-e2e
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## AgentShield Action E2E Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Description | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Safe server → exit 0 | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Vuln server → exit 1 + SHIELD-001 | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | SSRF detection → SHIELD-003 | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | Cred exfil → SHIELD-002 | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | Console output format | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 | HTML output format | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 7 | list-rules (18 detectors) | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 8 | Subdirectory path filters | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 9 | Action strict-mode behavior | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 10 | SARIF upload to Code Scanning | Attempted |" >> $GITHUB_STEP_SUMMARY
